<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Menu Nhà Hàng</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<h1>🍽 MENU NHÀ HÀNG</h1>


<div id="menu"></div>



<script src="menu.js"></script>


<script>

let box = document.getElementById("menu");


menu.forEach(item => {

box.innerHTML += `

<div class="item">

<div>

<h2>${item.name}</h2>

<p>${item.category}</p>

</div>


<span>
${item.price}
</span>


</div>

`;

});


</script>


</body>

</html>
