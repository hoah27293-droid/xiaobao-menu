<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A HUÁNG RESTAURANT</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<!-- TRANG CHỦ -->

<header class="hero">

<div class="overlay">

<h1>A HUÁNG RESTAURANT</h1>

<p>Hương vị Việt Nam - Phục vụ tận tâm</p>

<button>
Xem Menu
</button>

</div>

</header>



<!-- GIỚI THIỆU -->

<section class="about">

<h2>Về Nhà Hàng</h2>

<p>
Chuyên phục vụ các món ăn Việt Nam truyền thống,
món gia đình và các món đặc sản.
</p>

</section>



<!-- MENU -->

<section class="menu">

<h2>🍽 MENU MÓN ĂN</h2>


<div id="menu-list"></div>


</section>



<footer>

<p>
© 2026 A HUÁNG RESTAURANT
</p>

</footer>



<script src="menu.js"></script>


<script>

let menuBox = document.getElementById("menu-list");


menu.forEach(food=>{


menuBox.innerHTML += `

<div class="food">


<div>

<h3>${food.name}</h3>

<p>${food.category}</p>

</div>


<strong>
${food.price}
</strong>


</div>


`;


});


</script>


</body>

</html>
